name: Changelog

# A pull request that changes a skill folder or sync/ must also change
# CHANGELOG.md (README.md, "Releasing a change"). The check does not read the
# line. The skip-changelog label turns it off for one pull request.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      # Depth 2 fetches the PR's merge commit and its first parent, the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: CHANGELOG.md changes with a skill or the sync tooling
        run: |
          changed=$(git -c core.quotepath=off diff --name-only HEAD^1 HEAD)
          skills=$(ls -d */SKILL.md | cut -d/ -f1 | paste -sd'|' -)
          if grep -qE "^($skills|sync)/" <<<"$changed" && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "::error::A skill or the sync tooling changed. Add a line under '## Unreleased' in CHANGELOG.md, or add the skip-changelog label."
            exit 1
          fi
